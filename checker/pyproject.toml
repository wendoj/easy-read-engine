[project]
name = "easy-read-checker"
version = "0.1.0"
description = "Deterministic Easy Read checker service: sentences, key facts, P1-P8 and the symbol index"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "spacy>=3.8.18,<3.9",
    # Pinned spaCy model so checker results are reproducible (design "spaCy model").
    "en-core-web-sm",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
]

[tool.uv]
package = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
